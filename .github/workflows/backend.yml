name: Backend

on:
  push:
    branches: [main, BaseDelProyecto]
  pull_request:
    branches: [main]

jobs:
  import-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Run backend tests
        run: python -m pytest --ignore=tests/postgres
      - name: Import FastAPI application
        run: python -c "from app.main import app; assert app.title"

  postgres-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: reviews_test
          POSTGRES_PASSWORD: isolated-ci-test-password
          POSTGRES_DB: reviews_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reviews_test -d reviews_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://reviews_test:isolated-ci-test-password@localhost:5432/reviews_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Test PostgreSQL migrations and application flows
        run: python -m pytest tests/postgres -q
